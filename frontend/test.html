<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta property="og:title" content="NosPopuli — Ask">
  <meta property="og:description" content="Ask about a law, a place, or a person. Bills in plain English.">

  <!-- the woff2 files come from gstatic; without this the browser only
       discovers that origin after the stylesheet parses -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0e0e0e; --paper: #f5f0e8; --card: #faf7f2; --aged: #e8e0cc;
      --accent: #8b1a1a; --muted: #6b6355; --rule: #c8bfaa;
      --fd: "Playfair Display", Georgia, serif;
      --fb: "Source Serif 4", Georgia, serif;
      --fm: "IBM Plex Mono", monospace;
    }
    html, body { height: 100%; }
    /* Reserve the scrollbar so a short page and a tall one do not shift the
       layout sideways between renders. */
    html { scrollbar-gutter: stable; }
    @supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--fb); font-weight: 300; min-height: 100vh; min-height: 100dvh;
    }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }
    button { font: inherit; }
    @keyframes seat-in { from { opacity: 0; } to { opacity: .92; } }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes word-in { from { opacity: 0; } to { opacity: 1; } }
    /* The entrance fade is opt-in: render() adds .enter only when the
       page is genuinely a new view. Without that gate the animation
       restarts on every re-render (a streamed answer re-renders up to
       six times), which reads as the page flickering. */
    .view.enter { animation: viewIn .28s ease both; }

    /* ── county sheet: decisions scroller, meeting rows, board, modal ── */
    @keyframes mtgIn { from { opacity: 0; transform: translateY(-7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes supIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

    .focus-scroll {
      max-height: 340px; overflow-y: auto; padding-right: 12px;
      scrollbar-width: thin; scrollbar-color: var(--accent) var(--rule);
    }
    .focus-scroll::-webkit-scrollbar { width: 4px; }
    .focus-scroll::-webkit-scrollbar-track { background: var(--rule); }
    .focus-scroll::-webkit-scrollbar-thumb { background: var(--accent); }
    /* fades the last line when there is more below, so the list reads as
       scrollable without a scrollbar being the only clue */
    .focus-scroll.more {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%);
    }
    /* the fade alone doesn't read as "scrollable" until you're already
       scrolling; this text hint says so up front, and goes once you're
       at the bottom (same .more toggle the fade uses). */
    .scroll-hint {
      text-align: center; font-family: var(--fm); font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); padding-top: 6px;
      opacity: 0; transition: opacity .2s ease; pointer-events: none;
    }
    .focus-scroll.more + .scroll-hint { opacity: 1; }
    /* the coverage-note disclosure: no default triangle, label alone until clicked */
    summary::-webkit-details-marker { display: none; }
    .mtg-focus {
      display: grid; grid-template-columns: 1fr auto; gap: 18px;
      padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: start;
      animation: mtgIn .3s ease both;
    }
    .mtg-row { border-bottom: 1px solid var(--rule); padding: 11px 0; cursor: pointer;
               transition: background .16s ease, padding-left .16s ease; }
    .mtg-row:hover { background: var(--card); padding-left: 7px; }
    .mtg-row[aria-current="true"] { background: var(--card); }
    .mtg-open { font-family: var(--fm); font-size: 10px; letter-spacing: .14em;
                text-transform: uppercase; color: var(--accent); white-space: nowrap; }

    .sup-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0;
               border-bottom: 1px solid var(--rule); cursor: pointer;
               transition: background .16s ease, padding-left .16s ease; }
    .sup-row:hover { background: var(--card); padding-left: 7px; }

    /* placeholder plate: hatched, labelled, impossible to mistake for record */
    /* Hatched variant for the county sheet's placeholder plates only. The
       plain .plc further down is the shared one; do not restyle it here. */
    .plc-sheet { padding: 14px; background: none;
                 background-image: repeating-linear-gradient(135deg, transparent, transparent 7px,
                   rgba(14,14,14,.07) 7px, rgba(14,14,14,.07) 8px); }

    .sup-shade { position: fixed; inset: 0; z-index: 60; background: rgba(14,14,14,.42);
                 padding: 5vh 20px; overflow-y: auto; }
    .sup-card { max-width: 680px; margin: 0 auto; background: var(--paper);
                border: 1px solid var(--ink); animation: supIn .22s ease both; }
    @media (max-width: 700px) { .sup-grid { grid-template-columns: repeat(2, 1fr) !important; } }
    .dropcap::first-letter {
      font-family: var(--fd); font-size: 3.05em; line-height: .8; float: left;
      padding: 7px 9px 0 0; color: var(--accent); font-weight: 700;
    }
    .pnote {
      font: italic 14px/1.6 var(--fb); color: var(--muted);
      border-left: 1px solid var(--accent); padding: 3px 0 3px 14px; margin: 14px 0;
    }
    .folio {
      font: italic 12.5px/1 var(--fb); color: var(--muted); text-align: center;
      padding-top: 13px; border-top: 1px solid var(--rule); margin-top: 20px;
    }
    .folio b {
      font-family: var(--fm); font-style: normal; font-size: 9.5px;
      letter-spacing: .18em; text-transform: uppercase; font-weight: 400; color: var(--accent);
    }
    .kick { font-family: var(--fm); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
    .lbl { font-family: var(--fm); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
    .h1 {
      font-family: var(--fd); font-size: clamp(28px, 3.6vw, 38px); font-weight: 700;
      line-height: 1.08; letter-spacing: -.02em; color: var(--ink);
    }
    .h2 { font-family: var(--fd); font-size: 25px; font-weight: 700; line-height: 1.14; color: var(--ink); margin: 0 0 7px; }
    .body { font-family: var(--fb); font-size: 15.5px; line-height: 1.7; color: var(--ink); }
    .meta { font-family: var(--fb); font-size: 13px; font-style: italic; color: var(--muted); }
    .ex {
      border: 1px solid var(--rule); padding: 8px 13px; font-family: var(--fb);
      font-size: 14px; color: var(--ink); cursor: pointer; background: transparent;
    }
    .ex:hover { background: var(--card); }
    .rail {
      border: 1px solid var(--ink); padding: 15px 16px 18px;
      background: var(--card); margin-bottom: 16px;
    }
    .railq {
      border: 1px solid var(--rule); padding: 14px 16px 16px;
      background: var(--card); margin-bottom: 16px;
    }
    .abtn {
      width: 100%; text-align: left; border: 1px solid var(--accent); background: transparent;
      color: var(--accent); font-family: var(--fm); font-size: 11px; letter-spacing: .12em;
      text-transform: uppercase; padding: 11px 13px; cursor: pointer; margin-bottom: 8px;
    }
    .abtn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .abtn.on { border-color: var(--ink); color: var(--ink); }
    .sbtn {
      border: 1px solid var(--rule); background: transparent; color: var(--ink);
      font-family: var(--fm); font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
      padding: 7px 11px; cursor: pointer;
    }
    .sbtn:hover { border-color: var(--accent); color: var(--accent); }
    .wrap { max-width: 1020px; margin: 0 auto; padding: 22px 28px 40px; min-height: 100vh; min-height: 100dvh; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 1fr); gap: 34px; align-items: start; }
    @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
    .frow {
      display: grid; grid-template-columns: minmax(7rem, 10.5rem) 1fr 2.6rem; gap: 12px;
      align-items: center; cursor: pointer; background: none; border: 0; padding: 0;
      width: 100%; text-align: left;
    }
    .flabel { font-family: var(--fm); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .frow.on .flabel { color: var(--ink); }
    /* Stage filter is CSS: every card is rendered with data-stage; the
       shelves container's data-stage hides the rest and empties shelves. */
    .shelves-empty { display: none; }
    .shelves[data-stage="introduced"] .scard:not([data-stage="introduced"]),
    .shelves[data-stage="committee"] .scard:not([data-stage="committee"]),
    .shelves[data-stage="passed"] .scard:not([data-stage="passed"]),
    .shelves[data-stage="law"] .scard:not([data-stage="law"]) { display: none; }
    .shelves[data-stage="introduced"] .shelf:not(:has(.scard[data-stage="introduced"])),
    .shelves[data-stage="committee"] .shelf:not(:has(.scard[data-stage="committee"])),
    .shelves[data-stage="passed"] .shelf:not(:has(.scard[data-stage="passed"])),
    .shelves[data-stage="law"] .shelf:not(:has(.scard[data-stage="law"])) { display: none; }
    .shelves[data-stage="introduced"]:not(:has(.scard[data-stage="introduced"])) .shelves-empty,
    .shelves[data-stage="committee"]:not(:has(.scard[data-stage="committee"])) .shelves-empty,
    .shelves[data-stage="passed"]:not(:has(.scard[data-stage="passed"])) .shelves-empty,
    .shelves[data-stage="law"]:not(:has(.scard[data-stage="law"])) .shelves-empty { display: block; }
    .ftrack { height: 16px; background: var(--aged); border: 1px solid var(--rule); }
    .fnum {
      font-family: var(--fd); font-size: 19px; font-weight: 700; text-align: right;
      color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .dot { width: 9px; height: 9px; flex: none; }
    .dotl { font-family: var(--fm); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .plc {
      margin: 0 16px; border: 1px solid var(--rule);
      background: var(--aged);
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .plct {
      font-family: var(--fm); font-size: 9.5px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); line-height: 1.7;
    }
    .story { padding-bottom: 18px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; cursor: pointer; }
    .story:hover .h2 { color: var(--accent); }
    .scard {
      border: 1px solid var(--rule); padding: 12px 14px 12px; cursor: pointer;
      background: var(--card); min-width: 0; display: flex; flex-direction: column; gap: 6px;
    }
    .scard:hover { border-color: var(--ink); }
    .scard:hover .h2 { color: var(--accent); }
    .scard-kick {
      display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
      font-family: var(--fm); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
    .scard-area { margin-left: auto; text-align: right; letter-spacing: .06em; color: var(--muted); opacity: .85; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scard-detail { font-family: var(--fb); font-size: 12.5px; color: var(--muted); margin-top: 3px; padding-left: 57px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scard-title { font-size: 17.5px; line-height: 1.25; margin: 0; }
    .scard-text { font-family: var(--fb); font-size: 13.5px; line-height: 1.5; color: var(--ink); margin: 0; opacity: .9; }
    .scard-foot { margin-top: auto; padding-top: 8px; display: grid; gap: 6px; }
    .scard-who { font-family: var(--fb); font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pmark { display: inline-block; width: 4px; height: 13px; flex: none; }
    .scard-status { border-top: 1px solid var(--rule); padding-top: 8px; font-family: var(--fb); font-size: 13px; min-width: 0; }
    .scard-stage { font-weight: 600; flex: none; }
    .track { display: inline-flex; gap: 2px; flex: none; }
    .track span { width: 11px; height: 5px; background: var(--aged); border: 1px solid var(--rule); }
    .track span.on { background: var(--ink); border-color: var(--ink); }
    .track span.on.law { background: var(--accent); border-color: var(--accent); }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-family: var(--fm); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: -4px 0 14px; }
    .legend .track span { width: 9px; height: 4px; }
    .shelf { margin: 0 0 22px; }
    .shelf-row {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 10px;
    }
    .member-shelf {
      display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px;
      align-items: start; border: 1px solid var(--ink); padding: 14px 16px;
      background: var(--card); cursor: pointer;
    }
    .member-shelf img {
      width: 88px; height: 108px; object-fit: cover; display: block;
      background: var(--aged);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .chip {
      font-family: var(--fm); font-size: 9.5px; letter-spacing: .08em;
      text-transform: uppercase; border: 1px solid var(--rule); padding: 4px 8px;
      color: var(--ink);
    }
    .policy-bar { display: block; height: 7px; background: var(--aged); border: 1px solid var(--rule); overflow: hidden; }
    /* Reading column for bills */
    .read-col { min-width: 0; }
    .read { font-family: var(--fb); font-size: 16.5px; line-height: 1.7; color: var(--ink); margin: 0 0 14px; max-width: 38em; }
    .read strong { font-weight: 600; }
    .read-h { font-family: var(--fm); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 22px 0 8px; }
    .read-h:first-child { margin-top: 0; }
    .read-list { font-family: var(--fb); font-size: 16px; line-height: 1.65; margin: 0 0 14px; padding-left: 1.1em; max-width: 38em; }
    .read-list li { margin-bottom: 6px; }
    .read-list li::marker { color: var(--accent); }
    .folds { margin-top: 18px; border-top: 1px solid var(--ink); }
    .fold { border-bottom: 1px solid var(--rule); }
    .fold > summary {
      list-style: none; cursor: pointer; display: grid; grid-template-columns: 11.5rem minmax(0, 1fr) 1.2rem;
      gap: 12px; align-items: baseline; padding: 11px 0;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .fold > summary:hover .fold-lbl { color: var(--accent); }
    .fold-lbl { font-family: var(--fm); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
    .fold-fact { font-family: var(--fb); font-size: 14px; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fold[open] .fold-fact { white-space: normal; color: var(--ink); }
    .fold-chev { font-family: var(--fm); font-size: 13px; color: var(--muted); text-align: right; }
    .fold-body { padding: 4px 0 18px; }
    .fold-body .read, .fold-body .read-list { font-size: 15.5px; line-height: 1.65; }
    .fold-body .read-h { display: none; }
    @media (max-width: 720px) { .fold > summary { grid-template-columns: 1fr 1.2rem; } .fold-fact { grid-column: 1 / -1; } }
    .status-strip {
      display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start;
      border: 1px solid var(--rule); background: var(--card); padding: 12px 14px;
    }
    .status-strip .dots { margin: 5px 0 0; }
    .status-strip.is-law { border-color: var(--ink); }
    .tl { display: grid; gap: 0; }
    .tl-row { display: grid; grid-template-columns: 7.2rem 14px 1fr; gap: 10px; align-items: baseline; padding: 6px 0; }
    .tl-date { font-family: var(--fm); font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--aged); border: 1.5px solid var(--ink); position: relative; top: 1px; }
    .tl-dot.passed { background: var(--ink); }
    .tl-dot.law { background: var(--accent); border-color: var(--accent); }
    .tl-row + .tl-row .tl-dot::before { content: ""; position: absolute; left: 2px; bottom: 100%; width: 1px; height: 22px; background: var(--rule); }
    .tl-text { font-family: var(--fb); font-size: 14.5px; line-height: 1.5; }
    .vote-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: end; }
    @media (max-width: 720px) { .vote-grid { grid-template-columns: 1fr; } }
    .vote-block { min-width: 0; }
    .vote-bar { display: flex; height: 8px; background: var(--aged); border: 1px solid var(--rule); margin: 8px 0 6px; overflow: hidden; }
    .vote-bar span { display: block; height: 100%; }
    .gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 22px; }
    .billtext {
      font-family: var(--fb); font-size: 15px; line-height: 1.6; color: var(--ink);
      background: var(--card); border: 1px solid var(--rule); padding: 22px 26px; margin: 6px 0 0;
      max-height: 70vh; overflow: auto;
    }
    .billtext .bt-head { text-align: center; font-family: var(--fm); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
    .billtext .bt-rule { border: 0; border-top: 1px solid var(--rule); margin: 14px 0; }
    .billtext .bt-sec { font-family: var(--fd); font-size: 16px; font-weight: 700; margin: 20px 0 8px; line-height: 1.3; }
    .billtext .bt-sec:first-child { margin-top: 0; }
    .billtext .bt-secno { color: var(--accent); }
    .billtext .bt-title { text-align: center; font-family: var(--fm); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 400; margin: 26px 0 12px; }
    .billtext .bt-title .bt-secno { color: var(--ink); }
    .billtext .bt-toc { font-size: 13.5px; color: var(--muted); margin: 0 0 3px; padding-left: 1.5em; }
    .billtext .bt-p { margin: 0 0 8px; text-align: left; }
    .billtext .bt-enum { font-family: var(--fm); font-size: 12px; color: var(--muted); }
    /* District card: floats over the map box */
    .dpop {
      position: absolute; left: 8px; right: 8px; top: 8px; z-index: 5;
      background: var(--paper); border: 1px solid var(--ink); padding: 12px 14px 14px;
      box-shadow: 4px 4px 0 var(--aged); animation: dpop-in .18s ease-out;
    }
    @keyframes dpop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .dpop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .dpop-x { border: 0; background: none; font-family: var(--fd); font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 2px; }
    .dpop-x { transition: color 0.15s; }
    .dpop-x:hover { color: var(--accent); }
    .dpop-rep { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
    .dpop-rep img { width: 44px; height: 54px; object-fit: cover; background: var(--aged); display: block; }
    .dpop-rep div:first-child { transition: color 0.15s; }
    .dpop-rep:hover div:first-child { color: var(--accent); }
    .dpop-known { font-family: var(--fb); font-size: 13px; font-style: italic; color: var(--muted); margin-top: 8px; line-height: 1.45; }
    .dpop .abtn { margin-bottom: 0; }
    /* Elections */
    .elect { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; border: 1px solid var(--rule); background: var(--card); padding: 14px 16px; }
    .elect.past { opacity: .75; }
    .elect-date { text-align: center; border-right: 1px solid var(--rule); padding-right: 12px; }
    .sbtn.on { border-color: var(--accent); color: var(--accent); }
    .loading-page { padding: 48px 0 80px; min-height: 60vh; }
    .loading-rule { position: relative; height: 2px; background: var(--rule); max-width: 28em; overflow: hidden; }
    .loading-rule span {
      position: absolute; top: 0; left: 0; height: 100%; width: 30%; background: var(--accent);
      animation: rule-sweep 1.4s ease-in-out infinite;
    }
    @keyframes rule-sweep { 0% { left: -30%; } 100% { left: 100%; } }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .stat { border: 1px solid var(--rule); background: var(--card); padding: 12px 14px; }
    .stat-n { font-family: var(--fd); font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .mrow {
      display: grid; gap: 10px; align-items: center; padding: 7px 0;
      border-bottom: 1px solid var(--rule); min-width: 0;
    }
    .mrow > * { min-width: 0; }
