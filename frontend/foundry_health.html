<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scraper Health — Foundry · NosPopuli Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e0e0e; --paper: #f5f0e8; --aged: #e8e0cc; --card-bg: #faf7f2;
  --accent: #8b1a1a; --accent-light: #c0392b; --muted: #6b6355; --rule: #c8bfaa;
  --wide-width: 1240px;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); background: var(--paper);
  font-family: 'Source Serif 4', Georgia, serif;
  font-weight: 300; font-size: 0.95rem; line-height: 1.75;
}
main { max-width: var(--wide-width); margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

/* masthead */
.masthead { border-bottom: 3px double var(--ink); padding-bottom: 1rem; margin-bottom: 1.5rem; }
.masthead h1 {
  font-family: 'Playfair Display', serif; font-weight: 700;
  font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 0 0 0.25rem;
}
.masthead h1 span { font-style: italic; color: var(--accent); }
.tagline {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
}
.backlink {
  display: inline-block; font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--accent); text-decoration: none; margin-bottom: 0.65rem;
}
.backlink:hover { color: var(--ink); }
.topline { display: flex; justify-content: space-between; align-items: flex-end;
           gap: 1rem; flex-wrap: wrap; }

/* labels */
.section-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 0.5rem; margin: 2.5rem 0 0.75rem;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

/* summary figures */
.stats { display: flex; gap: 2.5rem; flex-wrap: wrap; margin: 0 0 0.5rem; }
.stat .n { font-family: 'Playfair Display', serif; font-size: 1.6rem;
           font-weight: 700; line-height: 1.2; }
.stat .n small { font-size: 0.9rem; font-weight: 400; color: var(--muted); }
.stat .l { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
           letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.stat .s { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
           color: var(--muted); letter-spacing: 0.04em; }

/* ledger table */
table { width: 100%; border-collapse: collapse; }
th {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--muted); text-align: left; font-weight: 400;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 0.45rem 0.75rem; white-space: nowrap;
}
td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--aged); vertical-align: top; }
tr.row { cursor: pointer; transition: background 0.15s; }
.backlink, .btn-ghost, .btn-primary { transition: color 0.15s, border-color 0.15s, background 0.15s; }
tr.row:hover { background: var(--card-bg); }
.name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700;
        line-height: 1.3; }
.code { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
        color: var(--accent); letter-spacing: 0.1em; }
.meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
        color: var(--muted); letter-spacing: 0.04em; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.figure { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; }

/* tags: three levels only - ink is fine, muted is absent, accent is broken */
.tag {
  display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem;
  letter-spacing: 0.1em; text-transform: uppercase; padding: 0.1rem 0.45rem;
  border: 1px solid var(--rule); color: var(--muted); white-space: nowrap;
}
.tag.good { color: var(--ink); border-color: var(--ink); }
.tag.bad  { color: var(--accent); border-color: var(--accent); }

/* certification bar */
.bar { display: flex; height: 7px; background: var(--aged); margin-top: 0.35rem;
       min-width: 110px; max-width: 200px; }
.bar i { display: block; height: 100%; }
.bar .cert { background: var(--ink); }
.bar .disp { background: var(--accent); }
.bar .lag  { background: var(--rule); }
.bar .unc  { background: var(--aged); }

/* expanded detail */
tr.detail > td { background: var(--card-bg); border-bottom: 1px solid var(--rule); }
.detail-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
                gap: 2.5rem; padding: 1rem 0.25rem 1.5rem; }
.detail-inner .section-label { margin: 0 0 0.6rem; }
.prose { font-size: 0.9rem; line-height: 1.7; }
.prose code { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
              color: var(--accent); letter-spacing: 0.05em; }
.event { border-left: 2px solid var(--rule); padding: 0.1rem 0 0.1rem 0.75rem;
         margin-bottom: 0.75rem; }
.event.bad { border-left-color: var(--accent); }
.event-head { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
.event-stage { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
               letter-spacing: 0.18em; text-transform: uppercase; }
.finding { font-size: 0.85rem; line-height: 1.6; margin: 0.35rem 0 0.35rem 0.5rem;
           padding-left: 0.75rem; border-left: 1px solid var(--rule); }
.finding b { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
             letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
             font-weight: 500; display: block; }

/* buttons */
.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem;
           align-items: center; }
.btn-ghost {
  background: none; border: 1px solid var(--rule); color: var(--accent);
  font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 0.4rem 0.75rem; cursor: pointer;
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); background: var(--accent);
                                  color: var(--paper); }
.btn-ghost:disabled { color: var(--muted); border-color: var(--aged); cursor: not-allowed; }
.btn-primary {
  background: var(--ink); color: var(--paper); border: none;
  font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em;
  text-transform: uppercase; padding: 0.5rem 1rem; cursor: pointer;
}
.btn-primary:hover { background: var(--accent); }

.joblog {
  background: var(--paper); border: 1px solid var(--rule); padding: 0.6rem 0.8rem;
  margin-top: 0.75rem; max-height: 240px; overflow: auto; white-space: pre-wrap;
  font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; line-height: 1.6;
  color: var(--muted);
}
.note { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
        letter-spacing: 0.06em; color: var(--muted); margin-top: 0.5rem; }
.empty { color: var(--muted); font-style: italic; padding: 1.5rem 0; }
.hidden { display: none; }

@media (max-width: 760px) {
  .hide-sm { display: none; }
  main { padding: 1.5rem 1rem 3rem; }
  .stats { gap: 1.5rem; }
  td, th { padding-left: 0.4rem; padding-right: 0.4rem; }
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <a class="backlink" href="/foundry">&#8592; Foundry ledger</a>
    <div class="topline">
      <div>
        <h1>Scraper <span>Health</span></h1>
        <div class="tagline">Foundry lab &middot; pipeline status &amp; certification</div>
      </div>
      <div style="text-align:right">
        <div class="meta" id="generated">Loading</div>
        <button class="btn-primary" id="reload" style="margin-top:0.4rem">Reload</button>
      </div>
    </div>
  </header>

  <div id="strip"></div>
  <div id="content"><div class="empty">Reading the health ledger&hellip;</div></div>
</main>

<script src="/static/js/foundry_health.js?v=2"></script>
</body>
</html>
