<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elections — NosPopuli</title>
<meta name="description" content="Upcoming federal, state, and local elections — dates, registration deadlines, and what's on your ballot.">
<meta property="og:site_name" content="NosPopuli">
<meta property="og:type" content="website">
<meta property="og:title" content="Upcoming Elections — NosPopuli">
<meta property="og:description" content="Upcoming federal, state, and local elections — dates, registration deadlines, and what's on your ballot.">
<meta property="og:url" content="https://nospopuli.org/elections">
<meta property="og:image" content="https://nospopuli.org/static/og-card.png">
<meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>

<header class="e-head" onclick="window.location='/'">
  <div class="masthead">Nos<span>Populi</span></div>
  <div class="tagline">Law for the People &nbsp;·&nbsp; Federal Legislation in Plain English</div>
</header>

<nav class="top-nav">
  <a class="top-nav-btn active" href="/elections">Elections</a>
  <a class="top-nav-btn" href="/?tab=letters">My Letters</a>
  <a class="top-nav-btn" href="/?tab=notifications">My Notifications</a>
</nav>

<div class="elections-page">
  <button class="detail-back" onclick="window.history.back()">← Back</button>
  <div class="elections-header">
    <h1 class="elections-title">Upcoming Elections</h1>
    <div class="elections-subtitle" id="elections-subtitle"></div>
  </div>

  <div id="elections-no-zip-banner" class="elections-no-zip" style="display:none">
    <p>Set your zip code to see which elections affect you.</p>
    <button class="elections-set-zip-btn" onclick="window.location='/?onboard=1'">Set zip code →</button>
  </div>

  <div id="elections-loading" class="elections-loading">
    <div class="loading-spinner">Loading elections…</div>
  </div>

  <div id="elections-error" class="elections-error" style="display:none"></div>

  <div id="elections-content" style="display:none">
    <div id="elections-tracked-section" style="display:none">
      <div class="elections-section-label">TRACKING</div>
      <div id="elections-tracked-list"></div>
    </div>

    <div id="elections-yours-section" style="display:none">
      <div class="elections-section-label">YOUR ELECTIONS</div>
      <div id="elections-yours-list"></div>
    </div>

    <div id="elections-other-section" style="display:none">
      <div class="elections-section-label">OTHER ELECTIONS</div>
      <div id="elections-other-list"></div>
    </div>

    <div id="elections-recent-section" style="display:none">
      <div class="elections-section-label">RECENT RESULTS</div>
      <div id="elections-recent-list"></div>
    </div>
  </div>
</div>

<script src="/static/js/elections_shared.js?v=1"></script>
<script>
// Prefs, tracking and the election-card renderer come from elections_shared.js.
async function loadElections() {
  const prefs = getPrefs();
  const zip = prefs?.zip || null;
  const state = prefs?.state || null;

  document.getElementById('elections-no-zip-banner').style.display = zip ? 'none' : 'block';

  const subtitle = document.getElementById('elections-subtitle');
  subtitle.textContent = zip
    ? `Based on zip ${zip}${state ? ' · ' + state : ''}`
    : 'National view — set your zip to personalize';

  try {
    const params = new URLSearchParams();
    if (zip) params.set('zip', zip);
    if (state) params.set('state', state);
    const res = await fetch(`/api/elections?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('elections-loading').style.display = 'none';
    document.getElementById('elections-content').style.display = 'block';

    if (data.error) {
      document.getElementById('elections-error').textContent = data.error;
      document.getElementById('elections-error').style.display = 'block';
      return;
    }

    const upcoming = data.upcoming || [];
    const recent = data.recent || [];

    const tracked = upcoming.filter(e => _trackedElections.has(e.id));
    const yours = upcoming.filter(e => e.affects_user && !_trackedElections.has(e.id));
    const other = upcoming.filter(e => !e.affects_user && !_trackedElections.has(e.id));

    _renderElectionSection('elections-tracked-section', 'elections-tracked-list', tracked, false);
    _renderElectionSection('elections-yours-section', 'elections-yours-list', yours, false);
    _renderElectionSection('elections-other-section', 'elections-other-list', other, false);
    _renderElectionSection('elections-recent-section', 'elections-recent-list', recent, true);

    if (!upcoming.length && !recent.length) {
      document.getElementById('elections-error').textContent = 'No election data available right now.';
      document.getElementById('elections-error').style.display = 'block';
    }
  } catch (e) {
    document.getElementById('elections-loading').style.display = 'none';
    document.getElementById('elections-error').textContent = 'Could not load elections. Please try again.';
    document.getElementById('elections-error').style.display = 'block';
  }
}

loadElections();
</script>
</body>
</html>
